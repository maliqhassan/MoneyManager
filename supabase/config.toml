# Supabase CLI configuration for LOCAL development (npx supabase start).
# Hosted project settings (auth providers, redirect URLs, SMTP) are configured
# in the Supabase dashboard — see docs/authentication.md.
project_id = "moneymanager"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "moneymanager-dev://"
additional_redirect_urls = [
  "moneymanager-dev://auth/callback",
  "moneymanager-preview://auth/callback",
  "moneymanager://auth/callback",
  "exp://**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.external.google]
enabled = false
# Set via environment when testing Google locally; never commit secrets.
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.delete-account]
verify_jwt = true
